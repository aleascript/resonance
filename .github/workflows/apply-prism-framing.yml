name: Apply Prism framing edits

on:
  push:
    branches:
      - docs/foreground-prisms

permissions:
  contents: write

jobs:
  patch-srd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foreground-prisms
          fetch-depth: 0

      - name: Apply bilingual SRD patch
        run: python3 tools/apply-prism-framing.py

      - name: Commit patched sources and remove temporary helpers
        run: |
          rm tools/apply-prism-framing.py
          rm .github/workflows/apply-prism-framing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: foreground Prisms in the Resonance SRD"
          git push origin HEAD:docs/foreground-prisms
